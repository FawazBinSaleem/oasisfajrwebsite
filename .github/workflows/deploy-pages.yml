name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender website
        run: npm run build

      - name: Inspect generated output
        run: |
          echo "All generated HTML files:"
          find .output dist -type f -name "*.html" 2>/dev/null || true

          echo ".output/public contents:"
          find .output/public -maxdepth 4 -type f | sort || true

      - name: Verify homepage exists
        run: |
          if [ ! -f ".output/public/index.html" ]; then
            echo "ERROR: .output/public/index.html was not generated."
            echo "The TanStack prerender configuration must be fixed before deployment."
            exit 1
          fi

      - name: Add GitHub Pages fallback
        run: cp .output/public/index.html .output/public/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
