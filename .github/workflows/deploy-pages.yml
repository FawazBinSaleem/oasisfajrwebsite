name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender website
        run: npm run build

      - name: Verify static output
        run: |
          test -f dist/client/index.html
          test -f dist/client/company/index.html
          test -f dist/client/contact/index.html
          test -f dist/client/gallery/index.html
          test -f dist/client/introduction/index.html
          test -f dist/client/organization/index.html
          test -f dist/client/projects/index.html
          test -f dist/client/safety/index.html
          test -f dist/client/specialization/index.html
          test -f dist/client/vision/index.html

      - name: Add GitHub Pages 404 fallback
        run: cp dist/client/index.html dist/client/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
