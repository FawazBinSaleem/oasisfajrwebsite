name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender website
        run: npm run build

      - name: Inspect build output
        run: |
          echo "Generated HTML files:"
          find dist .output -type f -name "*.html" 2>/dev/null || true

          echo "dist contents:"
          find dist -maxdepth 4 -type f 2>/dev/null | sort || true

          echo ".output contents:"
          find .output -maxdepth 4 -type f 2>/dev/null | sort || true

      - name: Prepare GitHub Pages files
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist

          if [ -f "dist/client/index.html" ]; then
            echo "Using dist/client"
            cp -R dist/client/. pages-dist/

          elif [ -f ".output/public/index.html" ]; then
            echo "Using .output/public"
            cp -R .output/public/. pages-dist/

          else
            echo "ERROR: No static index.html was generated."
            echo "HTML files found:"
            find dist .output -type f -name "*.html" 2>/dev/null || true
            exit 1
          fi

      - name: Verify pages
        run: |
          test -f pages-dist/index.html

          echo "Prepared Pages files:"
          find pages-dist -maxdepth 3 -type f | sort

      - name: Add GitHub Pages fallback
        run: cp pages-dist/index.html pages-dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
